<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6B2C3E" />
    <title>Salia Admin — Offline</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; margin: 0; }
      html, body { height: 100%; }
      body {
        display: flex; align-items: center; justify-content: center;
        min-height: 100dvh;
        padding: max(24px, env(safe-area-inset-top)) 24px max(24px, env(safe-area-inset-bottom));
        background: #F7EDEF; color: #241C1E;
        font-family: "Inter", system-ui, -apple-system, sans-serif;
        text-align: center;
      }
      .card {
        width: 100%; max-width: 360px;
        background: #fff; border: 1px solid #EAD9DD; border-radius: 20px;
        padding: 32px 24px;
      }
      .mark {
        width: 56px; height: 56px; margin: 0 auto 16px;
        display: flex; align-items: center; justify-content: center;
        border-radius: 9999px; background: #6B2C3E; color: #F7EDEF;
        font-family: Georgia, "Times New Roman", serif; font-weight: 600; font-size: 28px;
      }
      h1 { font-size: 18px; font-weight: 700; color: #241C1E; }
      p { margin-top: 8px; font-size: 14px; color: #8A7B7F; line-height: 1.6; }
      button {
        margin-top: 20px; width: 100%;
        border: 0; border-radius: 9999px; padding: 12px 20px;
        background: #6B2C3E; color: #fff; font-size: 14px; font-weight: 600;
        cursor: pointer;
      }
      button:active { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">S</div>
      <h1>Kamu sedang offline</h1>
      <p>Dashboard butuh koneksi internet untuk memuat data terbaru. Cek koneksi lalu coba lagi.</p>
      <button type="button" onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
