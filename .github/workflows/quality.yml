name: Quality

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: ESLint
        run: npm run lint:code
      - name: Prettier
        run: npm run format:check
      - name: No comments in CSS
        run: npm run check:comments
      - name: Build
        run: npm run build
